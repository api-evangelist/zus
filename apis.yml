aid: zus
url: https://raw.githubusercontent.com/api-evangelist/zus/refs/heads/main/apis.yml
name: Zus Health
kind: company
description: Zus Health is a shared health-data platform that aggregates a patient's
  clinical history from external networks into the Zus Aggregated Profile (ZAP). It
  exposes a FHIR R4 (v4.0.1) REST API secured with OAuth2 Bearer tokens, Patient History
  APIs, document ingestion and retrieval, Zushooks webhooks, a GraphQL FHIR Query
  Service, and embeddable open-source React components.
