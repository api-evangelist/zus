  baseURL: https://api.zusapi.com
  properties:
  - url: https://docs.zushealth.com/docs/zushooks
    type: Documentation
  - url: openapi/zus-openapi.yml
    type: OpenAPI
  description: Zushooks deliver inbound HTTPS callbacks when patient data is created
    or updated in the Zus FHIR Store - ADT events, medication pickups, lab results,
    and status changes - filtered by JQ criteria and authenticated with basic auth
    or OAuth client credentials.
