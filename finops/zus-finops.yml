description: >-
  FinOps view of Zus Health platform spend. Zus uses a sales-led, contract-based
  commercial model with no published public per-unit rates, so cost meters here
  are structural placeholders rather than reconciled billed quantities. Likely
  cost drivers include platform/partnership subscription, Patient History data
  retrieval jobs against external networks, stored FHIR resources and documents,
  and webhook (Zushooks) delivery. Verify the billing model and metered units
  with Zus during reconciliation.
notes: >-
  No public pricing or billing export schema is documented. The billing model,
  currency, frequency, and metered units below are inferred structure pending
  confirmation from Zus Health.
sources:
- https://zushealth.com
- https://docs.zushealth.com
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Zus Health
serviceCategory: Healthcare
billingModel:
  pricingCategory: Commitment-Based
  billingFrequency: Contract
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Zus Health Platform
  ServiceCategory: Healthcare
  ProviderName: Zus Health
  PublisherName: Zus Health
  InvoiceIssuerName: Zus Health
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Commitment-Based
meters:
- name: platform_subscription
  description: Recurring platform/partnership subscription per agreement.
  unit: contract
  aggregation: flat
  dimensions:
  - account
- name: patient_history_jobs
  description: Patient History jobs that retrieve external data into the ZAP.
  unit: jobs
  aggregation: sum
  dimensions:
  - account
  - patient
- name: stored_resources
  description: FHIR resources and documents stored in the Zus FHIR Store.
  unit: resources
  aggregation: sum
  dimensions:
  - account
  - resourceType
- name: webhook_deliveries
  description: Zushooks inbound HTTPS callbacks delivered on data activity.
  unit: deliveries
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Request usage and billing detail from Zus; no self-service billing export is publicly documented.
- name: Allocation
  description: Map App Clients and patient panels to internal cost centers and programs.
- name: Optimization
  description: Scope Patient History retrieval and subscription enrollment to actively-treated patients (Patient.active) to avoid unnecessary aggregation.
- name: Accountability
  description: Review partnership spend against contracted volumes and patient panel size periodically.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
